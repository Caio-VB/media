<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Aprovação de Carrosséis - Hiden</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-3 h-3 rounded-full bg-cyan-400 animate-pulse"></div>
                <span class="text-slate-400 font-normal">Gerenciador de Carrosséis</span>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="configurarToken()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-full border border-slate-700 transition">🔑 Configurar Token</button>
                <div id="status-sync" class="text-xs bg-slate-800 text-slate-300 px-3 py-1 rounded-full border border-slate-700">Carregando dados...</div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-10">
        <div id="container-cards" class="grid grid-cols-1 gap-8">
            <!-- Os carrosséis serão injetados aqui via JS -->
        </div>
    </main>

    <!-- Modal para zoom na imagem -->
    <div id="modal" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50 p-4" onclick="fecharModal()">
        <img id="modal-img" class="max-h-[90vh] max-w-[90vw] rounded-xl shadow-2xl border border-slate-700">
    </div>

    <script>
        // ================= CONFIGURAÇÕES DO SEU GITHUB =================
        const GITHUB_USER = "Caio-VB";    
        const GITHUB_REPO = "media"; 
        const BRANCH = "main";                      

        let carrosseisData = [];
        let shaArquivo = ""; 

        function configurarToken() {
            let tokenAtual = localStorage.getItem('github_token') || '';
            let novoToken = prompt("Cole o seu GitHub Personal Access Token (com permissão 'repo'):", tokenAtual);
            if (novoToken !== null) {
                localStorage.setItem('github_token', novoToken.trim());
                alert("Token salvo com sucesso neste navegador!");
                carregarDados();
            }
        }

        async function carregarDados() {
            try {
                let resposta = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/carrosseis.json?ref=${BRANCH}&t=` + new Date().getTime(), {
                    headers: {
                        'Accept': 'application/vnd.github+json'
                    }
                });
                let jsonResponse = await resposta.json();
                
                shaArquivo = jsonResponse.sha;
                let decodedContent = decodeURIComponent(escape(atob(jsonResponse.content)));
                carrosseisData = JSON.parse(decodedContent);

                renderizarCards();
                document.getElementById('status-sync').innerText = "Sincronizado com GitHub";
                document.getElementById('status-sync').className = "text-xs bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-full border border-emerald-500/30";
            } catch (err) {
                console.error(err);
                document.getElementById('status-sync').innerText = "Erro ao carregar dados da API";
                document.getElementById('status-sync').className = "text-xs bg-rose-500/20 text-rose-400 px-3 py-1 rounded-full border border-rose-500/30";
            }
        }

        function renderizarCards() {
            let container = document.getElementById('container-cards');
            container.innerHTML = "";

            if (carrosseisData.length === 0) {
                container.innerHTML = `<p class="text-slate-500 text-center py-10">Nenhum carrossel encontrado.</p>`;
                return;
            }

            carrosseisData.forEach((item, index) => {
                let titulo = item.titulo;
                let status = item.status || "pendente";
                let slug = titulo.replace(/[^\w\-_]/g, "_").substring(0, 35);

                let badgeClass = "bg-yellow-500/20 text-yellow-400 border-yellow-500/30";
                if (status === "concluido" || status === "aprovado") {
                    badgeClass = "bg-green-500/20 text-green-400 border-green-500/30";
                } else if (status === "reprovado") {
                    badgeClass = "bg-red-500/20 text-red-400 border-red-500/30";
                }

                // Renderiza dinamicamente assumindo até 10 slides possíveis. 
                // A função onerror oculta automaticamente qualquer slide que não exista fisicamente na pasta.
                let slidesHtml = "";
                for (let i = 1; i <= 10; i++) {
                    let tipoSufixo = (i === 1) ? 'capa' : 'conteudo';
                    // Se for o último slide padrão ou contiver cta, o script tenta carregar com cta também via onerror em cascata
                    
                    slidesHtml += `
                        <div class="flex-shrink-0 w-60 rounded-xl overflow-hidden border border-slate-700/60 bg-slate-900 shadow-lg relative group slide-container-${index}-${i}" style="display: none;">
                            <img src="saida_carrosseis/${slug}/slide_${i}_capa.png" 
                                 onerror="this.onerror=function(){this.onerror=function(){this.parentElement.style.display='none'}; this.src='saida_carrosseis/${slug}/slide_${i}_cta.png'}; this.src='saida_carrosseis/${slug}/slide_${i}_conteudo.png';" 
                                 onload="this.parentElement.style.display='block'"
                                 class="w-full h-auto object-cover hover:scale-105 transition-transform duration-300 cursor-pointer min-h-[300px] bg-slate-950" 
                                 onclick="abrirModal(this.src)"
                                 alt="Slide ${i}">
                            <span class="absolute bottom-2 left-2 bg-black/60 text-white text-[10px] px-2 py-0.5 rounded backdrop-blur">Slide ${i}</span>
                        </div>
                    `;
                }

                let card = document.createElement('div');
                card.className = "bg-slate-800/80 backdrop-blur-md border border-slate-700 rounded-2xl p-6 shadow-xl flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <span class="text-xs uppercase tracking-wider px-3 py-1 rounded-full border ${badgeClass}" id="badge-${index}">${status}</span>
                            <span class="text-xs text-slate-400">Item #${index + 1}</span>
                        </div>
                        <h2 class="text-xl font-bold text-white mb-6">${titulo}</h2>
                        <div class="flex gap-4 overflow-x-auto pb-4 mb-6 scrollbar-thin scrollbar-thumb-slate-600">
                            ${slidesHtml}
                        </div>
                    </div>

                    <div class="flex items-center gap-4 pt-4 border-t border-slate-700/80">
                        <button onclick="enviarAcao(${index}, 'aprovado')" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 px-4 rounded-xl transition shadow-lg shadow-emerald-900/30 flex items-center justify-center gap-2 cursor-pointer">
                            Aprovar
                        </button>
                        <button onclick="enviarAcao(${index}, 'reprovado')" class="flex-1 bg-rose-600 hover:bg-rose-500 text-white font-semibold py-2.5 px-4 rounded-xl transition shadow-lg shadow-rose-900/30 flex items-center justify-center gap-2 cursor-pointer">
                            Reprovar
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function enviarAcao(index, novoStatus) {
            let token = localStorage.getItem('github_token');
            if (!token) {
                alert("Você precisa configurar o seu Token do GitHub primeiro! Clique no botão '🔑 Configurar Token' no topo.");
                configurarToken();
                return;
            }

            carrosseisData[index].status = novoStatus;
            let badge = document.getElementById(`badge-${index}`);
            badge.innerText = novoStatus;
            
            if (novoStatus === 'aprovado') {
                badge.className = "text-xs uppercase tracking-wider px-3 py-1 rounded-full border bg-green-500/20 text-green-400 border-green-500/30";
            } else {
                badge.className = "text-xs uppercase tracking-wider px-3 py-1 rounded-full border bg-red-500/20 text-red-400 border-red-500/30";
            }

            document.getElementById('status-sync').innerText = "Salvando no GitHub...";
            document.getElementById('status-sync').className = "text-xs bg-yellow-500/20 text-yellow-400 px-3 py-1 rounded-full border border-yellow-500/30";

            try {
                let jsonString = JSON.stringify(carrosseisData, null, 2);
                let contentBase64 = btoa(unescape(encodeURIComponent(jsonString)));

                let resposta = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/carrosseis.json`, {
                    method: 'PUT',
                    headers: {
                        'Accept': 'application/vnd.github+json',
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Atualização de status via Painel Web: ${carrosseisData[index].titulo} -> ${novoStatus}`,
                        content: contentBase64,
                        sha: shaArquivo,
                        branch: BRANCH
                    })
                });

                if (resposta.ok) {
                    let resultadoJson = await resposta.json();
                    shaArquivo = resultadoJson.content.sha; 
                    document.getElementById('status-sync').innerText = "Salvo com sucesso!";
                    document.getElementById('status-sync').className = "text-xs bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-full border border-emerald-500/30";
                } else {
                    let erroData = await resposta.json();
                    console.error(erroData);
                    alert("Erro ao salvar no GitHub: " + (erroData.message || "Token inválido ou sem permissão."));
                    document.getElementById('status-sync').innerText = "Erro ao salvar";
                    document.getElementById('status-sync').className = "text-xs bg-rose-500/20 text-rose-400 px-3 py-1 rounded-full border border-rose-500/30";
                }
            } catch(e) {
                console.error(e);
                alert("Erro de conexão ao tentar salvar.");
            }
        }

        function abrirModal(src) {
            let modal = document.getElementById('modal');
            let modalImg = document.getElementById('modal-img');
            modalImg.src = src;
            modal.style.display = 'flex';
        }

        function fecharModal() {
            document.getElementById('modal').style.display = 'none';
        }

        carregarDados();
    </script>
</body>
</html>
